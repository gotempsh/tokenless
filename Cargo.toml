# SPDX-FileCopyrightText: 2026 tokenless contributors
# SPDX-License-Identifier: MIT OR Apache-2.0
[workspace]
resolver = "2"
members = [
    "crates/tokenless-core",
    "crates/tokenless-auth",
    "crates/tokenless-control",
    "crates/tokenless-dataplane",
    "crates/broker-server",
    "crates/tokenless-conformance",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
publish = false

[workspace.dependencies]
tokenless-core = { path = "crates/tokenless-core" }
tokenless-auth = { path = "crates/tokenless-auth" }
tokenless-control = { path = "crates/tokenless-control" }
tokenless-dataplane = { path = "crates/tokenless-dataplane" }
tokenless-conformance = { path = "crates/tokenless-conformance" }

aes-gcm = "0.10"
arc-swap = "1.7"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log", "tracing"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2 = "1"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "linux-native", "windows-native"] }
rand = "0.8"
rpassword = "7"
ring = "0.17"
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `yaml_serde`, the YAML organization's maintained `serde_yaml`, under the
# old name so `serde_yaml::` paths keep working. Never the real `serde_yaml`:
# it and its `unsafe-libyaml` parser are unmaintained (RUSTSEC-2024-0449);
# tokenless-core's dependency tests fail if either is locked again.
serde_yaml = { package = "yaml_serde", version = "0.10" }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.5"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util", "fs", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
url = "2"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rust-embed = { version = "8", features = ["mime-guess"] }
# OpenTelemetry: logs and metrics over OTLP/HTTP, configured by the
# standard OTEL_* variables. HTTP only (no gRPC, so no tonic), and no HTTP
# client of its own: exports go through the server's reqwest and rustls.
opentelemetry = { version = "0.33", default-features = false, features = ["logs", "metrics", "internal-logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["logs", "metrics", "internal-logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["logs", "metrics", "http-proto", "http-json", "gzip-http", "internal-logs"] }
opentelemetry-http = { version = "0.33", default-features = false, features = ["internal-logs"] }
opentelemetry-appender-tracing = "0.33"
# Tests only: decoding what the exporter sends.
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "logs", "metrics"] }
prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
webpki-roots = "1"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
x509-parser = "0.18"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
