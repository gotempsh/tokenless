# SPDX-License-Identifier: MIT OR Apache-2.0

# Pushing a tag such as v0.1.0 publishes that version:
#
# - a GitHub release with a binary archive per platform (console embedded),
#   SHA256SUMS, and a keyless cosign signature bundle for every file;
# - build provenance attestations for every archive and the image;
# - a multi-arch image at ghcr.io/<owner>/tokenless, signed with cosign.
#
# A tag with a suffix (v0.2.0-rc.1) is published as a prerelease and does
# not move the image's `latest` tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  console:
    name: Console
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the workspace version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "${tag%%-*}" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $crate in Cargo.toml"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Build
        working-directory: broker-ui
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: console
          path: broker-ui/dist

  build:
    name: Build ${{ matrix.target }}
    needs: console
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: console
          path: broker-ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked --bin tokenless --target "${{ matrix.target }}"
          else
            cargo build --release --locked --bin tokenless --target "${{ matrix.target }}"
          fi
      - name: Package
        shell: bash
        run: |
          name="tokenless-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/tokenless" "dist/$name/"
          cp README.md LICENSE-APACHE LICENSE-MIT "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/tokenless-${{ matrix.target }}.tar.gz

  release:
    name: GitHub release
    needs: [console, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum tokenless-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        working-directory: dist
        run: |
          for f in tokenless-*.tar.gz SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/tokenless-*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.console.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "tokenless $VERSION" \
            --generate-notes --verify-tag $prerelease

  image:
    name: Container image
    needs: [console, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*-linux-musl
          path: archives
          merge-multiple: true
      - name: Lay out the binaries per platform
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"; target="${pair#*:}-unknown-linux-musl"
            mkdir -p "packaging/linux/$arch"
            tar -xzf "archives/tokenless-$target.tar.gz" -C archives
            mv "archives/tokenless-$target/tokenless" "packaging/linux/$arch/tokenless"
          done
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tokenless" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: packaging
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
