id: grafana
version: 1
name: "Grafana Cloud"
description: "Dashboards, alerts and the Grafana HTTP API."
category: monitoring
suggested_variable: GRAFANA_TOKEN
hosts:
  - "*.grafana.net"
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "Service account token"
injection:
  method: bearer
  field: token
host_override:
  allowed: true
  required: false
  label: "Self-hosted Grafana URL (https://host[:port])"
