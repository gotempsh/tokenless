id: sanity
version: 1
name: "Sanity"
description: "Content Lake APIs for a Sanity project."
category: developer_tools
aliases: [cms]
suggested_variable: SANITY_API_TOKEN
hosts:
  - api.sanity.io
  - "*.api.sanity.io"
  - "*.apicdn.sanity.io"
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API token"
injection:
  method: bearer
  field: token
