id: paddle
version: 1
name: "Paddle"
description: "Billing and subscriptions."
category: payments
suggested_variable: PADDLE_API_KEY
hosts:
  - api.paddle.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
