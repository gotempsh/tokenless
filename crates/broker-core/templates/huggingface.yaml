id: huggingface
version: 1
name: "Hugging Face"
description: "Inference providers and the Hub API."
category: llm_providers
aliases: [hf]
suggested_variable: HF_TOKEN
hosts:
  - huggingface.co
  - router.huggingface.co
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "Access token"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /api/whoami-v2
  expect_status: [200]
