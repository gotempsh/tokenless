id: generic-bearer
version: 2
name: "Custom HTTP API (bearer)"
description: "Any HTTPS API that accepts \"Authorization: Bearer\". The host is chosen per credential (admin only)."
category: custom
hosts: []
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "Token"
injection:
  method: bearer
  field: token
host_override:
  allowed: true
  required: true
  label: "API host (https://host[:port])"
