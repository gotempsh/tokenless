id: github
version: 2
name: "GitHub"
description: "Repos, issues and pull requests on GitHub."
category: developer_tools
popular: true
suggested_variable: GITHUB_TOKEN
hosts:
  - api.github.com
  - uploads.github.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "Personal access token"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /user
  expect_status: [200]
