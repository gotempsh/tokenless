id: stripe
version: 2
name: "Stripe"
description: "Payments, billing and the Stripe API."
category: payments
popular: true
suggested_variable: STRIPE_SECRET_KEY
hosts:
  - api.stripe.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: secret_key
    label: "Secret key"
injection:
  method: bearer
  field: secret_key
validation:
  method: GET
  path: /v1/balance
  expect_status: [200]
