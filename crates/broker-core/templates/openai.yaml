id: openai
version: 2
name: "OpenAI"
description: "Chat, embeddings and other models from OpenAI."
category: llm_providers
popular: true
aliases: [gpt, chatgpt]
suggested_variable: OPENAI_API_KEY
hosts:
  - api.openai.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: api_key
    label: "API key"
injection:
  method: bearer
  field: api_key
validation:
  method: GET
  path: /v1/models
  expect_status: [200]
