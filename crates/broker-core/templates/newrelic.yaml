id: newrelic
version: 1
name: "New Relic"
description: "NerdGraph and REST APIs for New Relic."
category: monitoring
aliases: [apm, observability]
suggested_variable: NEW_RELIC_API_KEY
hosts:
  - api.newrelic.com
  - api.eu.newrelic.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: api_key
    label: "User key"
injection:
  method: header
  name: "Api-Key"
  field: api_key
