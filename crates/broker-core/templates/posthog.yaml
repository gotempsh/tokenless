id: posthog
version: 1
name: "PostHog"
description: "Product analytics and feature flags."
category: monitoring
suggested_variable: POSTHOG_API_KEY
hosts:
  - us.posthog.com
  - eu.posthog.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "Personal API key"
injection:
  method: bearer
  field: token
host_override:
  allowed: true
  required: false
  label: "Self-hosted PostHog URL (https://host[:port])"
