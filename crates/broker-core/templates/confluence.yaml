id: confluence
version: 1
name: "Confluence"
description: "Atlassian Confluence pages and spaces."
category: productivity
aliases: [atlassian, wiki]
suggested_variable: CONFLUENCE_API_TOKEN
hosts:
  - "*.atlassian.net"
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: username
    label: "Email"
  - name: password
    label: "API token"
injection:
  method: basic
  username_field: username
  password_field: password
