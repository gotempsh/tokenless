id: bugsnag
version: 1
name: "BugSnag"
description: "Errors and stability data."
category: monitoring
aliases: [errors]
suggested_variable: BUGSNAG_TOKEN
hosts:
  - api.bugsnag.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: api_key
    label: "Personal auth token"
injection:
  method: header
  name: "Authorization"
  field: api_key
  prefix: "token "
validation:
  method: GET
  path: /user
  expect_status: [200]
