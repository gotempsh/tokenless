id: sambanova
version: 1
name: "SambaNova Cloud"
description: "Fast open-model inference on SambaNova."
category: llm_providers
suggested_variable: SAMBANOVA_API_KEY
hosts:
  - api.sambanova.ai
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /v1/models
  expect_status: [200]
