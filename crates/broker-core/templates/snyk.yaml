id: snyk
version: 1
name: "Snyk"
description: "Vulnerability data and projects on Snyk."
category: developer_tools
aliases: [security]
suggested_variable: SNYK_TOKEN
hosts:
  - api.snyk.io
  - api.eu.snyk.io
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: api_key
    label: "API token"
injection:
  method: header
  name: "Authorization"
  field: api_key
  prefix: "token "
