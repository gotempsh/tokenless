id: together
version: 1
name: "Together AI"
description: "Open models on Together AI."
category: llm_providers
suggested_variable: TOGETHER_API_KEY
hosts:
  - api.together.xyz
  - api.together.ai
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /v1/models
  expect_status: [200]
