id: upstash
version: 1
name: "Upstash"
description: "Serverless Redis and Kafka management API."
category: developer_tools
suggested_variable: UPSTASH_API_KEY
hosts:
  - api.upstash.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: username
    label: "Email"
  - name: password
    label: "API key"
injection:
  method: basic
  username_field: username
  password_field: password
