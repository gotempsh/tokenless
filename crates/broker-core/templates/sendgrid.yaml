id: sendgrid
version: 1
name: "SendGrid"
description: "Transactional email delivery."
category: communication
suggested_variable: SENDGRID_API_KEY
hosts:
  - api.sendgrid.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /v3/scopes
  expect_status: [200]
