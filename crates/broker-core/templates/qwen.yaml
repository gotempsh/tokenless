id: qwen
version: 1
name: "Qwen (Alibaba Cloud)"
description: "Qwen models through Alibaba Cloud Model Studio (DashScope)."
category: llm_providers
aliases: [dashscope, alibaba]
suggested_variable: DASHSCOPE_API_KEY
hosts:
  - dashscope-intl.aliyuncs.com
  - dashscope.aliyuncs.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
