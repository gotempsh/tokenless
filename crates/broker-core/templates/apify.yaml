id: apify
version: 1
name: "Apify"
description: "Actors, runs and datasets for web scraping."
category: search
aliases: [scraping, crawler]
suggested_variable: APIFY_TOKEN
hosts:
  - api.apify.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API token"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /v2/users/me
  expect_status: [200]
