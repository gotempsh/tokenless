id: incident-io
version: 1
name: "incident.io"
description: "Incidents, alerts and status pages."
category: monitoring
aliases: [incidents, on-call]
suggested_variable: INCIDENT_IO_API_KEY
hosts:
  - api.incident.io
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
