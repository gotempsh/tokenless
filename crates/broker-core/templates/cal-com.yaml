id: cal-com
version: 1
name: "Cal.com"
description: "Bookings and event types on Cal.com."
category: productivity
aliases: [scheduling, calcom]
suggested_variable: CAL_API_KEY
hosts:
  - api.cal.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
