id: koyeb
version: 1
name: "Koyeb"
description: "Apps and services on Koyeb."
category: infrastructure
suggested_variable: KOYEB_TOKEN
hosts:
  - app.koyeb.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API token"
injection:
  method: bearer
  field: token
