id: exa
version: 1
name: "Exa"
description: "Neural web search and contents."
category: search
suggested_variable: EXA_API_KEY
hosts:
  - api.exa.ai
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: api_key
    label: "API key"
injection:
  method: header
  name: "x-api-key"
  field: api_key
