id: twilio
version: 1
name: "Twilio"
description: "SMS, voice and messaging."
category: communication
suggested_variable: TWILIO_AUTH_TOKEN
hosts:
  - api.twilio.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: username
    label: "Account SID"
  - name: password
    label: "Auth token"
injection:
  method: basic
  username_field: username
  password_field: password
