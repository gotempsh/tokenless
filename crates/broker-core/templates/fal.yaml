id: fal
version: 1
name: "fal"
description: "Generative media models on fal."
category: llm_providers
aliases: [image, video]
suggested_variable: FAL_KEY
hosts:
  - fal.run
  - queue.fal.run
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: api_key
    label: "API key"
injection:
  method: header
  name: "Authorization"
  field: api_key
  prefix: "Key "
