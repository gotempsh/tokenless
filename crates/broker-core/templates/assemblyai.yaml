id: assemblyai
version: 1
name: "AssemblyAI"
description: "Speech-to-text and audio intelligence."
category: llm_providers
aliases: [speech, transcription]
suggested_variable: ASSEMBLYAI_API_KEY
hosts:
  - api.assemblyai.com
  - api.eu.assemblyai.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: api_key
    label: "API key"
injection:
  method: header
  name: "Authorization"
  field: api_key
