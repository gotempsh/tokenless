id: postman
version: 1
name: "Postman"
description: "Collections, environments and monitors."
category: developer_tools
suggested_variable: POSTMAN_API_KEY
hosts:
  - api.getpostman.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: api_key
    label: "API key"
injection:
  method: header
  name: "X-Api-Key"
  field: api_key
validation:
  method: GET
  path: /me
  expect_status: [200]
