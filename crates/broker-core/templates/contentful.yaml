id: contentful
version: 1
name: "Contentful"
description: "Content management and delivery APIs."
category: developer_tools
aliases: [cms]
suggested_variable: CONTENTFUL_ACCESS_TOKEN
hosts:
  - api.contentful.com
  - cdn.contentful.com
  - preview.contentful.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "Access token"
injection:
  method: bearer
  field: token
