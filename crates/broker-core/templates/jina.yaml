id: jina
version: 1
name: "Jina AI"
description: "Embeddings, reranking, reader and search APIs."
category: llm_providers
aliases: [embeddings, reader]
suggested_variable: JINA_API_KEY
hosts:
  - api.jina.ai
  - r.jina.ai
  - s.jina.ai
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
