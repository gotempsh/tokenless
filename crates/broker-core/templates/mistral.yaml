id: mistral
version: 1
name: "Mistral AI"
description: "Chat and embedding models from Mistral."
category: llm_providers
suggested_variable: MISTRAL_API_KEY
hosts:
  - api.mistral.ai
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /v1/models
  expect_status: [200]
