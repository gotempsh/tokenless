id: onesignal
version: 1
name: "OneSignal"
description: "Push, email and in-app notifications."
category: communication
aliases: [push, notifications]
suggested_variable: ONESIGNAL_REST_API_KEY
hosts:
  - api.onesignal.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: api_key
    label: "REST API key"
injection:
  method: header
  name: "Authorization"
  field: api_key
  prefix: "Key "
