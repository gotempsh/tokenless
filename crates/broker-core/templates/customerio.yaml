id: customerio
version: 1
name: "Customer.io"
description: "Messaging and campaigns through the App API."
category: communication
aliases: [email, messaging]
suggested_variable: CUSTOMERIO_APP_API_KEY
hosts:
  - api.customer.io
  - api-eu.customer.io
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "App API key"
injection:
  method: bearer
  field: token
