id: cohere
version: 1
name: "Cohere"
description: "Cohere's language and embedding models."
category: llm_providers
suggested_variable: COHERE_API_KEY
hosts:
  - api.cohere.com
  - api.cohere.ai
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /v1/models
  expect_status: [200]
