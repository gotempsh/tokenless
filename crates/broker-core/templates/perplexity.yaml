id: perplexity
version: 1
name: "Perplexity"
description: "Perplexity's answer engine."
category: llm_providers
suggested_variable: PERPLEXITY_API_KEY
hosts:
  - api.perplexity.ai
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
