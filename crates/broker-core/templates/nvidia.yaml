id: nvidia
version: 1
name: "NVIDIA NIM"
description: "Hosted NVIDIA NIM model endpoints."
category: llm_providers
suggested_variable: NVIDIA_API_KEY
hosts:
  - integrate.api.nvidia.com
  - ai.api.nvidia.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /v1/models
  expect_status: [200]
