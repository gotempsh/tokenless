id: lemonsqueezy
version: 1
name: "Lemon Squeezy"
description: "Payments and subscriptions for software."
category: payments
suggested_variable: LEMONSQUEEZY_API_KEY
hosts:
  - api.lemonsqueezy.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /v1/users/me
  expect_status: [200]
