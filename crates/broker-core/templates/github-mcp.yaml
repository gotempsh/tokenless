id: github-mcp
version: 1
name: "GitHub MCP"
description: "Repos, issues and pull requests as MCP tools."
category: developer_tools
kind: mcp
logo: github
aliases: [github, mcp]
suggested_variable: GITHUB_TOKEN
hosts:
  - api.githubcopilot.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "Personal access token"
injection:
  method: bearer
  field: token
