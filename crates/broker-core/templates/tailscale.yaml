id: tailscale
version: 1
name: "Tailscale"
description: "Devices, ACLs and keys in a tailnet."
category: infrastructure
aliases: [vpn, wireguard]
suggested_variable: TAILSCALE_API_KEY
hosts:
  - api.tailscale.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
