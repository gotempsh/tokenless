id: neon
version: 1
name: "Neon"
description: "Serverless Postgres projects and branches."
category: developer_tools
suggested_variable: NEON_API_KEY
hosts:
  - console.neon.tech
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /api/v2/users/me
  expect_status: [200]
