id: luma
version: 1
name: "Luma AI"
description: "Dream Machine video and image generation."
category: llm_providers
aliases: [video]
suggested_variable: LUMAAI_API_KEY
hosts:
  - api.lumalabs.ai
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
