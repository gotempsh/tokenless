id: render
version: 1
name: "Render"
description: "Services and deploys on Render."
category: infrastructure
suggested_variable: RENDER_API_KEY
hosts:
  - api.render.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /v1/services
  expect_status: [200]
