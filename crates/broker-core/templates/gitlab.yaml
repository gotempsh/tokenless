id: gitlab
version: 2
name: "GitLab"
description: "Repos and pipelines on GitLab."
category: developer_tools
suggested_variable: GITLAB_TOKEN
hosts:
  - gitlab.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "Personal access token"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /api/v4/user
  expect_status: [200]
host_override:
  allowed: true
  required: false
  label: "Self-managed GitLab URL (https://host[:port])"
