id: tavily
version: 1
name: "Tavily"
description: "Web search built for agents."
category: search
suggested_variable: TAVILY_API_KEY
hosts:
  - api.tavily.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
