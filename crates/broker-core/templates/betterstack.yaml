id: betterstack
version: 1
name: "Better Stack"
description: "Uptime monitors, incidents and logs."
category: monitoring
aliases: [uptime, logtail]
suggested_variable: BETTERSTACK_API_TOKEN
hosts:
  - uptime.betterstack.com
  - telemetry.betterstack.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API token"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /api/v2/monitors
  expect_status: [200]
