id: cerebras
version: 1
name: "Cerebras"
description: "Fast inference on Cerebras hardware."
category: llm_providers
suggested_variable: CEREBRAS_API_KEY
hosts:
  - api.cerebras.ai
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API key"
injection:
  method: bearer
  field: token
validation:
  method: GET
  path: /v1/models
  expect_status: [200]
