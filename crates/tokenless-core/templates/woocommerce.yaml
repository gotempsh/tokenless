id: woocommerce
version: 1
name: "WooCommerce"
description: "Products and orders on a WooCommerce store. The host is chosen per credential (admin only)."
category: commerce
aliases: [wordpress]
suggested_variable: WOOCOMMERCE_CONSUMER_SECRET
hosts: []
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: username
    label: "Consumer key"
  - name: password
    label: "Consumer secret"
injection:
  method: basic
  username_field: username
  password_field: password
host_override:
  allowed: true
  required: true
  label: "Store URL (https://host[:port])"
