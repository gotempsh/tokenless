id: pipedrive
version: 1
name: "Pipedrive"
description: "Deals, persons and pipelines. Covers every *.pipedrive.com company domain."
category: productivity
aliases: [crm]
suggested_variable: PIPEDRIVE_API_TOKEN
hosts:
  - api.pipedrive.com
  - "*.pipedrive.com"
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: api_key
    label: "API token"
injection:
  method: header
  name: "x-api-token"
  field: api_key
