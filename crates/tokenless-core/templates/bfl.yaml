id: bfl
version: 1
name: "Black Forest Labs"
description: "FLUX image models."
category: llm_providers
aliases: [flux, image]
suggested_variable: BFL_API_KEY
hosts:
  - api.bfl.ai
  - api.us1.bfl.ai
  - api.eu1.bfl.ai
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: api_key
    label: "API key"
injection:
  method: header
  name: "x-key"
  field: api_key
