id: railway
version: 1
name: "Railway"
description: "Projects and deploys on Railway (GraphQL)."
category: infrastructure
suggested_variable: RAILWAY_TOKEN
hosts:
  - backboard.railway.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "API token"
injection:
  method: bearer
  field: token
