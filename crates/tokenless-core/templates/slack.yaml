id: slack
version: 1
name: "Slack"
description: "Post messages and build Slack apps."
category: communication
popular: true
suggested_variable: SLACK_TOKEN
hosts:
  - slack.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: token
    label: "Bot or user token"
injection:
  method: bearer
  field: token
