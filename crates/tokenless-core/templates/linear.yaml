id: linear
version: 1
name: "Linear"
description: "Issue tracking and project management (GraphQL)."
category: productivity
suggested_variable: LINEAR_API_KEY
hosts:
  - api.linear.app
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: api_key
    label: "API key"
injection:
  method: header
  name: "Authorization"
  field: api_key
