id: scaleway
version: 1
name: "Scaleway"
description: "Instances, storage and the Scaleway API."
category: infrastructure
suggested_variable: SCW_SECRET_KEY
hosts:
  - api.scaleway.com
allow:
  paths: ["/*"]
  methods: ["*"]
credential_fields:
  - name: api_key
    label: "Secret key"
injection:
  method: header
  name: "X-Auth-Token"
  field: api_key
