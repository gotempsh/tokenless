#
# The built-in service catalogue. tools/catalog/generate.py turns each
# [[service]] into crates/broker-core/templates/<id>.yaml and finds its logo.
#
# Keys (only id, name, description, category and auth are required):
#   id, version         slug; bump version whenever hosts, auth or headers change
#   name, description   shown in the catalogue
#   category            llm_providers developer_tools infrastructure communication
#                       monitoring productivity payments commerce search custom
#   kind                "mcp" for an MCP server (default: HTTP API)
#   hosts               exact hosts or "*.example.com" (one label); port defaults to 443
#   paths, methods      default ["/*"] and ["*"]
#   auth                "bearer" | "header" (needs header, optional prefix) | "basic"
#   field, label        secret field name and label (default token / api_key, "API key")
#   username_label, password_label (+ _description)   for basic auth
#   headers             default custom headers, e.g. { "Notion-Version" = "2022-06-28" }
#   variable            suggested variable key, e.g. "GITHUB_TOKEN"
#   validate, expect    test request, e.g. "GET /v1/models" (expect defaults to [200])
#   override            { required = bool, label = "..." }: admins may set the host
#   popular, aliases    catalogue placement and extra search words
#   logo                logo key when shared with another service (e.g. "github")
#   icon                "svgl:<title>" | "lobe:<key>" | "simple:<slug>" | "gilbarbara:<file>" | "none";
#                       omitted: first match in svgl, then Lobe, Simple Icons and gilbarbara/logos
#   icon_dark_fills     fills to turn white in the dark-mode variant (an all-dark mark
#                       gets a white variant automatically)
#   docs                where the auth scheme was checked (not shipped)


